# Por defecto, Robolectric arma la Application que diga el manifest (CompanionApplication) para
# CUALQUIER prueba del módulo, aunque no tenga nada que ver con ella. Eso incluye las pruebas de
# data/consola y data/respaldos que no sabían nada de esto hasta que esta fase registró
# CompanionApplication en AndroidManifest.xml: su onCreate() arma Modulos entero, que a su vez
# construye PreferenciasDeConsolaCifradas con un MasterKey real del Android Keystore
# (androidx.security.crypto) — y ese Keystore no existe en el entorno de Robolectric
# ("AndroidKeyStore not found"), así que cualquier prueba sin este archivo truena al arrancar,
# sin que tenga nada que ver con lo que esa prueba revisa.
#
# La Application real de producción (con todo el contenedor de dependencias) solo hace falta
# para las pruebas que explícitamente la necesiten (ninguna por ahora: las capturas Roborazzi
# arman sus pantallas con datos falsos, sin pasar por Modulos ni por la consola de verdad).
application=android.app.Application
